<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Review Dashboard</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6ea;
    --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --grey:#9ca3af;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:12px 20px; display:flex;
           align-items:center; gap:16px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sp { flex:1; }
  header button { background:#374151; color:#fff; border:0; padding:6px 12px;
                  border-radius:6px; cursor:pointer; font-size:13px; }
  header button:hover { background:#4b5563; }
  .wrap { max-width:1100px; margin:20px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:14px; }
  .gate { max-width:420px; margin:80px auto; }
  .gate input { width:100%; padding:10px; border:1px solid var(--line);
                border-radius:6px; font-size:14px; margin:10px 0; }
  .btn { background:var(--blue); color:#fff; border:0; padding:9px 16px;
         border-radius:6px; cursor:pointer; font-size:14px; }
  .btn:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.4; cursor:default; filter:none; }
  .pager { display:flex; gap:12px; align-items:center; justify-content:center; }
  .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .filters input { padding:7px 10px; border:1px solid var(--line); border-radius:6px; }
  .filters select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .tab { background:#e5e7eb; color:var(--ink); border:0; padding:6px 13px;
         border-radius:6px; cursor:pointer; font-size:13px; }
  .tab.on { background:var(--ink); color:#fff; }
  .mini { background:#e5e7eb; color:var(--ink); border:0; padding:4px 10px;
          border-radius:5px; cursor:pointer; font-size:12px; }
  .mini:hover { background:#d1d5db; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; color:var(--muted); text-transform:uppercase;
       letter-spacing:.04em; padding:8px 10px; border-bottom:2px solid var(--line); }
  td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:#f0f4ff; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px;
           font-weight:600; color:#fff; }
  .b-queued{background:var(--grey);} .b-running{background:var(--blue);}
  .b-complete{background:var(--green);} .b-error{background:var(--red);}
  .verdict { font-size:12px; padding:1px 7px; border-radius:4px; font-weight:600; }
  .v-approve{background:#dcfce7;color:#15803d;}
  .v-requestchanges,.v-request-changes{background:#fef3c7;color:#b45309;}
  .v-blocking{background:#fee2e2;color:#b91c1c;}
  .muted { color:var(--muted); font-size:12px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .progress { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af;
              padding:10px 14px; border-radius:8px; font-weight:600;
              display:flex; align-items:center; gap:10px; }
  .spin { width:14px; height:14px; border:2px solid #bfdbfe; border-top-color:var(--blue);
          border-radius:50%; animation:sp 0.8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .review { background:var(--card); border:1px solid var(--line); border-radius:10px;
            margin-bottom:14px; }
  .review h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--line);
               font-size:14px; }
  .review .body { padding:14px 16px; }
  .review.claude h3 { color:#0e7490; } .review.codex h3 { color:#b45309; }
  .md h4,.md .mh { font-weight:700; margin:14px 0 4px; }
  .md code { background:#f1f3f5; padding:1px 5px; border-radius:4px;
             font-family:ui-monospace,monospace; font-size:12px; }
  .md pre.cb { background:#1e2330; color:#e6e9ef; padding:12px; border-radius:8px;
               overflow-x:auto; font-size:12px; }
  .md li { margin-left:18px; }
  .testrow { display:flex; gap:10px; align-items:center; padding:6px 0;
             border-bottom:1px solid var(--line); }
  .t-passed{color:var(--green);} .t-failed,.t-timeout,.t-error{color:var(--red);}
  .t-skipped{color:var(--muted);}
  .finding { border-left:3px solid var(--line); padding:6px 10px; margin:7px 0;
             background:#fafbfc; border-radius:0 6px 6px 0; }
  .finding.f-bug{border-color:var(--red);}
  .finding.f-concern{border-color:var(--amber);}
  .finding.f-nit{border-color:var(--grey);}
  .sev { font-size:11px; font-weight:700; padding:1px 6px; border-radius:4px;
         text-transform:uppercase; }
  .sev-bug{background:#fee2e2;color:#b91c1c;}
  .sev-concern{background:#fef3c7;color:#b45309;}
  .sev-nit{background:#f1f3f5;color:#6b7280;}
  /* Fix-complexity tier suggested by reviewers; routes the dev AI's
     model choice. A=Sonnet-OK, B=needs Opus, C=ask human. */
  .tier { font-size:11px; font-weight:700; padding:1px 6px; border-radius:4px;
          margin-left:4px; cursor:help; }
  .tier-A{background:#cffafe;color:#0e7490;}
  .tier-B{background:#ede9fe;color:#6d28d9;}
  .tier-C{background:#fce7f3;color:#be185d;}
  /* submission-details card */
  .sub-section { margin:10px 0; }
  .sub-section:first-child { margin-top:0; }
  .sub-label { font-size:11px; font-weight:700; text-transform:uppercase;
               letter-spacing:0.04em; color:#64748b; margin-bottom:4px; }
  .sub-context { padding:8px 10px; background:#f8f9fb; border:1px solid var(--line);
                 border-radius:6px; white-space:pre-wrap; font-size:13px;
                 line-height:1.5; }
  .sub-flag { display:inline-block; font-size:11px; font-weight:600;
              padding:2px 8px; border-radius:4px; margin:2px 4px 2px 0;
              background:#e2e8f0; color:#334155; }
  .sub-flag-warn { background:#fef3c7; color:#92400e; }
  details.handoff-disclosure { background:#f8f9fb; border:1px solid var(--line);
                               border-radius:6px; padding:6px 10px; }
  details.handoff-disclosure summary { cursor:pointer; font-weight:600;
                                       color:#1e293b; outline:none; }
  details.handoff-disclosure[open] summary { margin-bottom:8px; }
  details.handoff-disclosure pre { margin:0; white-space:pre-wrap;
                                   font-family:ui-monospace,Menlo,Consolas,monospace;
                                   font-size:12px; line-height:1.5;
                                   max-height:480px; overflow-y:auto; }
  /* Awaiting-approval banner (caller_depth>1) */
  .approval-banner { padding:14px 16px; background:#fef3c7; border:1px solid #fbbf24;
                     border-left:4px solid #d97706; border-radius:6px;
                     margin-bottom:14px; }
  .approval-banner h3 { margin:0 0 6px; color:#92400e; font-size:15px; }
  .approval-banner p { margin:6px 0; font-size:13px; line-height:1.5;
                       color:#78350f; }
  .approval-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn-approve { background:#15803d; color:#fff; border:1px solid #166534;
                 padding:6px 14px; border-radius:5px; font-size:13px;
                 font-weight:600; cursor:pointer; }
  .btn-approve:hover { background:#166534; }
  .btn-reject { background:#fff; color:#b91c1c; border:1px solid #ef4444;
                padding:6px 14px; border-radius:5px; font-size:13px;
                font-weight:600; cursor:pointer; }
  .btn-reject:hover { background:#fee2e2; }
  /* Caller-context card (task #10) */
  details.caller-disclosure { background:#f8f9fb; border:1px solid var(--line);
                              border-radius:6px; padding:6px 10px; }
  details.caller-disclosure summary { cursor:pointer; font-weight:600;
                                      color:#1e293b; outline:none; }
  details.caller-disclosure[open] summary { margin-bottom:8px; }
  details.caller-disclosure pre { margin:0; white-space:pre-wrap;
                                  font-family:ui-monospace,Menlo,Consolas,monospace;
                                  font-size:12px; line-height:1.5;
                                  max-height:600px; overflow-y:auto; }
  /* Status badge for awaiting_approval */
  .v-awaiting_approval { background:#fef3c7; color:#92400e; }
  /* peer disagreement row inside each .finding */
  .peer { margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
          font-size:12px; line-height:1.4; }
  .peer-label { font-weight:600; color:#64748b; margin-right:4px; }
  .peer-stance { font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px;
                 text-transform:uppercase; margin-right:6px; letter-spacing:0.02em; }
  .peer-agree    { background:#dcfce7; color:#15803d; }
  .peer-disagree { background:#fee2e2; color:#b91c1c; }
  .peer-unsure   { background:#e2e8f0; color:#475569; }
  .peer-note { color:#475569; }
  .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:720px){ .fgrid{grid-template-columns:1fr;} }
  .iter { display:flex; align-items:center; gap:10px; padding:7px 10px;
          border:1px solid var(--line); border-radius:6px; text-decoration:none;
          color:var(--ink); font-size:13px; }
  .iter:hover { background:#f8f9fb; }
  .iter.current { background:#eef4ff; border-color:#9ec5ff; font-weight:600; }
  .iter .ord { font-weight:700; min-width:22px; }
  .iter .vd { color:#6b7280; font-size:12px; }
  a.back { color:var(--blue); cursor:pointer; text-decoration:none; font-size:13px; }
  details summary { cursor:pointer; color:var(--blue); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px; }
</style>
</head>
<body>

<div id="gate" class="gate card" style="display:none">
  <h2 style="margin-top:0">AI Review Dashboard</h2>
  <p class="muted">Enter the server API key to continue. It is stored only in this browser.</p>
  <input id="keyInput" type="password" placeholder="Bearer API key" autocomplete="off">
  <button class="btn" onclick="saveKey()">Connect</button>
  <p id="gateErr" style="color:var(--red);display:none">Invalid key.</p>
</div>

<div id="app" style="display:none">
  <header>
    <h1>AI Review Dashboard</h1>
    <span class="sp"></span>
    <span id="autostat" class="muted" style="color:#9ca3af"></span>
    <button onclick="refresh(true)">Refresh</button>
    <button onclick="clearKey()">Change key</button>
  </header>
  <div class="wrap">
    <div id="listView">
      <div class="card filters">
        <button id="tabActive" class="tab on" onclick="setView(false)">Active</button>
        <button id="tabArchived" class="tab" onclick="setView(true)">Archived</button>
        <span style="width:8px"></span>
        <input id="fProject" placeholder="project" oninput="debouncedRefresh()">
        <input id="fFeature" placeholder="feature" oninput="debouncedRefresh()">
        <select id="fRepo" onchange="debouncedRefresh()">
          <option value="">All repos</option>
        </select>
        <span style="flex:1"></span>
        <label class="muted">Per page
          <select id="perPage" onchange="changePerPage()">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <span id="count" class="muted"></span>
      </div>
      <div class="card" style="padding:0">
        <table>
          <thead><tr>
            <th>Status</th><th>Project / Feature</th><th>Repos</th>
            <th>Verdicts</th><th>Created</th><th></th>
          </tr></thead>
          <tbody id="jobRows"></tbody>
        </table>
        <div id="listEmpty" class="empty" style="display:none">No jobs.</div>
      </div>
      <div class="card pager">
        <button id="pgPrev" class="btn" onclick="pg(-1)">&lsaquo; Prev</button>
        <span id="pgInfo" class="muted"></span>
        <button id="pgNext" class="btn" onclick="pg(1)">Next &rsaquo;</button>
      </div>
    </div>

    <div id="detailView" style="display:none">
      <p><a class="back" onclick="showList()">&larr; All jobs</a></p>
      <div id="detailBody"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let KEY = localStorage.getItem('ai_review_key') || '';
let openJobId = null;
let refreshTimer = null;
let openJobTerminal = false;  // true once the open job is complete/error —
                              // stops the 6s auto-refresh from rebuilding the
                              // detail DOM (which would collapse the transcript)

function gate(show){ $('gate').style.display = show?'block':'none';
                     $('app').style.display = show?'none':'block'; }
function saveKey(){ KEY = $('keyInput').value.trim();
                    localStorage.setItem('ai_review_key', KEY); boot(); }
function clearKey(){ localStorage.removeItem('ai_review_key'); KEY=''; gate(true); }

async function api(path){
  const r = await fetch(path, { headers:{ 'Authorization':'Bearer '+KEY } });
  if(r.status===401||r.status===403){ $('gateErr').style.display='block';
                                      gate(true); throw new Error('auth'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// --- markdown-lite (escape first => XSS-safe) ---
function renderMd(t){
  if(!t) return '<span class="muted">(none)</span>';
  let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/```[\w]*\n?([\s\S]*?)```/g,(m,c)=>'<pre class="cb">'+c+'</pre>');
  h = h.replace(/^#{1,6}\s*(.+)$/gm,'<div class="mh">$1</div>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');
  h = h.replace(/\n/g,'<br>');
  return h;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(ts){ return ts ? ts.replace('T',' ').replace('Z',' UTC') : '—'; }
function shortRepo(u){ return (u||'').replace(/^.*[:/]/,'').replace(/\.git$/,''); }

function verdictTag(v){
  if(!v) return '';
  const cls = 'v-'+v.replace(/[^a-z]/g,'');
  return '<span class="verdict '+cls+'">'+esc(v)+'</span>';
}
function renderIterations(iters, currentId){
  if(!iters || iters.length<=1) return '';
  // Server returns oldest-first (so iteration #1 = first). Reverse for
  // display so the newest iteration is at the top; #N stays meaningful.
  const rows = iters.slice().reverse().map(it=>{
    const cur = it.job_id===currentId;
    const cv = it.claude_verdict, xv = it.codex_verdict;
    const verd = (cv||xv)
      ? '<span class="vd">C:'+esc(cv||'?')+' &nbsp; X:'+esc(xv||'?')+'</span>'
      : '';
    return '<a class="iter'+(cur?' current':'')+'" href="#job/'+esc(it.job_id)+'">'+
      '<span class="ord">#'+it.iteration+'</span>'+
      '<span class="badge b-'+it.status+'">'+it.status+'</span>'+
      '<span class="muted mono" style="font-size:12px">'+fmt(it.created_at)+'</span>'+
      verd+
      (cur?'<span class="muted" style="margin-left:auto">(this one)</span>':'')+
      '</a>';
  }).join('');
  return '<div class="card"><h3 style="margin:0 0 10px">Feature timeline · '+
    iters.length+' iteration'+(iters.length===1?'':'s')+
    '</h3><div style="display:flex;flex-direction:column;gap:6px">'+
    rows+'</div></div>';
}
// Reviewer-suggested fix-complexity tier. The dev AI uses this to route
// fixes: A → Sonnet subagent, B → Opus (keep it), C → surface to human.
// Reviewers may omit the field; we just don't render a badge in that case.
const TIER_LABELS = {
  A: { name: 'Sonnet',    title: 'Tier A — mechanical fix, OK for Sonnet' },
  B: { name: 'Opus',      title: 'Tier B — judgment-bearing, keep on Opus' },
  C: { name: 'Ask human', title: 'Tier C — decision-shaped, surface to human' },
};
// ReviewRequest defaults — mirrored from server.py to detect deviations.
// Keep these in sync. A field is "non-default" when its actual value differs
// from the corresponding entry here.
const REQ_DEFAULTS = {
  only: [],
  include_all: false,
  summary_only: false,
  no_handoff: false,
  run_tests: true,
  test_timeout_s: 900,
  handoff_path: null,
  caller_depth: 1,
};
function renderSubmissionCard(j, r){
  const req = j.request || {};
  const ctx = (req.context||'').trim();
  const handoffSrc = r.handoff_source || '';
  const handoffBody = r.handoff_content || '';
  // Collect deviations from defaults — these are the flags worth surfacing.
  const flagBits = [];
  if((req.only||[]).length)
    flagBits.push({label:'only: '+(req.only.length)+' glob(s)',
                   title:(req.only||[]).join('\n'), warn:false});
  if(req.include_all)
    flagBits.push({label:'include_all', title:'Bypasses noise + repo-exclude filters', warn:true});
  if(req.summary_only)
    flagBits.push({label:'summary_only', title:'Reviewers see commit log + file stats, no line-level diff', warn:true});
  if(req.no_handoff)
    flagBits.push({label:'no_handoff', title:'Implementer handoff intentionally skipped', warn:true});
  if(req.handoff_path)
    flagBits.push({label:'handoff_path='+req.handoff_path, title:'Custom handoff path', warn:false});
  if(req.run_tests === false)
    flagBits.push({label:'run_tests=false', title:'Tier-1 test execution disabled', warn:true});
  if(typeof req.test_timeout_s === 'number' && req.test_timeout_s !== REQ_DEFAULTS.test_timeout_s)
    flagBits.push({label:'test_timeout_s='+req.test_timeout_s, title:'', warn:false});
  if(typeof req.caller_depth === 'number' && req.caller_depth !== REQ_DEFAULTS.caller_depth)
    flagBits.push({
      label:'caller_depth='+req.caller_depth,
      title:'Symbol-graph caller analysis: depth 2 surfaces indirect callers (1 hop). Requires approval before the review runs.',
      warn:true,
    });
  // If there's literally nothing meaningful to show, render nothing.
  if(!ctx && !handoffSrc && !handoffBody && !flagBits.length) return '';

  let h = '<div class="card"><h3 style="margin:0 0 10px">Submission · what the coder AI sent</h3>';

  if(ctx){
    h += '<div class="sub-section">'+
         '<div class="sub-label">Context (inline note from request)</div>'+
         '<div class="sub-context">'+esc(ctx)+'</div></div>';
  }

  if(handoffSrc || handoffBody){
    h += '<div class="sub-section"><div class="sub-label">Handoff</div>';
    if(handoffSrc){
      h += '<div class="mono muted" style="margin-bottom:6px">'+esc(handoffSrc)+'</div>';
    }
    if(handoffBody){
      h += '<details class="handoff-disclosure">'+
           '<summary>show handoff content ('+handoffBody.length.toLocaleString()+' chars)</summary>'+
           '<pre>'+esc(handoffBody)+'</pre></details>';
    } else if(handoffSrc){
      h += '<div class="muted" style="font-size:12px">(handoff body not preserved — older job)</div>';
    }
    h += '</div>';
  }

  if(flagBits.length){
    h += '<div class="sub-section"><div class="sub-label">Non-default flags</div><div>';
    h += flagBits.map(f=>{
      const cls = f.warn ? 'sub-flag sub-flag-warn' : 'sub-flag';
      const t = f.title ? ' title="'+esc(f.title)+'"' : '';
      return '<span class="'+cls+'"'+t+'>'+esc(f.label)+'</span>';
    }).join('');
    h += '</div></div>';
  }

  h += '</div>';
  return h;
}
// Build a 1-based-index lookup for the OTHER reviewer's stance on these
// findings. Out-of-range or duplicate finding_ids are tolerated: the last
// well-formed entry for an id wins, others are dropped. Reviewers that
// emit no peer_assessment (legacy / skip-reconcile path) yield an empty
// map and renderFindings just skips the peer row.
function peerMap(peerAssessment){
  const m = {};
  (peerAssessment||[]).forEach(p=>{
    if(p && Number.isInteger(p.finding_id)) m[p.finding_id] = p;
  });
  return m;
}
function renderPeerRow(peer, otherName){
  const stance = String(peer.stance||'unsure').toLowerCase();
  const cls = (stance==='agree'||stance==='disagree') ? stance : 'unsure';
  const note = peer.note ? ' <span class="peer-note">— '+esc(peer.note)+'</span>' : '';
  return '<div class="peer">'+
    '<span class="peer-label">'+esc(otherName)+' says:</span>'+
    '<span class="peer-stance peer-'+cls+'">'+esc(stance)+'</span>'+note+
    '</div>';
}
function renderFindings(findings, peerAssessment, otherName){
  if(!findings || !findings.length) return '<span class="muted">none</span>';
  const peers = peerMap(peerAssessment);
  return findings.map((f, i)=>{
    const sev = (f.severity||'nit').toLowerCase();
    const loc = [f.repo,f.file,f.lines].filter(Boolean).join(' · ');
    const tier = (f.tier||'').toString().toUpperCase();
    const tinfo = TIER_LABELS[tier];
    const tierBadge = tinfo
      ? '<span class="tier tier-'+tier+'" title="'+esc(tinfo.title)+'">'+
        esc(tier)+' · '+esc(tinfo.name)+'</span>'
      : '';
    // finding_id is 1-based (matches the numbered list the reconcile
    // prompt feeds the peer reviewer).
    const peer = peers[i+1];
    const peerRow = (peer && otherName) ? renderPeerRow(peer, otherName) : '';
    return '<div class="finding f-'+sev+'">'+
      '<span class="sev sev-'+sev+'">'+esc(sev)+'</span>'+tierBadge+' '+
      '<b>'+esc(f.title||'(untitled)')+'</b>'+
      (loc?'<div class="muted mono">'+esc(loc)+'</div>':'')+
      (f.detail?'<div style="margin-top:2px">'+esc(f.detail)+'</div>':'')+
      peerRow+
      '</div>';
  }).join('');
}

// --- list view (paginated, filterable, archive-aware) ---
let page = 0;
let perPage = 25;
let showArchived = false;
function pg(delta){ page = Math.max(0, page+delta); loadList(); }
function changePerPage(){ perPage = +$('perPage').value; page = 0; loadList(); }
function setView(arch){
  showArchived = arch; page = 0;
  $('tabActive').classList.toggle('on', !arch);
  $('tabArchived').classList.toggle('on', arch);
  loadList();
}
async function archiveJob(id, archive){
  await fetch('/reviews/'+id+'/'+(archive?'archive':'unarchive'),
    { method:'POST', headers:{ 'Authorization':'Bearer '+KEY } });
  if(openJobId===id) loadDetail(); else loadList();
}
async function cancelJob(id){
  if(!confirm('Cancel this queued job? It will be marked errored.')) return;
  const r = await fetch('/reviews/'+id+'/cancel',
    { method:'POST', headers:{ 'Authorization':'Bearer '+KEY } });
  if(!r.ok){
    let msg = 'HTTP '+r.status;
    try { msg = (await r.json()).detail || msg; } catch(e){}
    alert('Could not cancel: '+msg);
  }
  if(openJobId===id) loadDetail(); else loadList();
}

// Approve a caller_depth>1 job. Transitions awaiting_approval → queued and
// kicks off the review immediately. Confirmation dialog spells out the
// token cost since depth-2 reviews are meaningfully more expensive.
async function approveDepth(id){
  if(!confirm(
    'Approve caller_depth=2 for this review?\n\n' +
    'Adds ~10-25K extra input tokens (~85% catch rate of cross-cut bugs, ' +
    'up from ~70% at depth 1). The review will start running immediately.'
  )) return;
  const r = await fetch('/reviews/'+id+'/approve-depth',
    { method:'POST', headers:{ 'Authorization':'Bearer '+KEY } });
  if(!r.ok){
    let msg = 'HTTP '+r.status;
    try { msg = (await r.json()).detail || msg; } catch(e){}
    alert('Could not approve: '+msg);
    return;
  }
  if(openJobId===id) loadDetail(); else loadList();
}

// Reject a caller_depth>1 job with a reason. Marks errored; coder AI can
// resubmit with caller_depth=1 to bypass the approval gate.
async function rejectDepth(id){
  const reason = prompt(
    'Reject this caller_depth=2 request?\n\n' +
    'Reason (shown to the coder AI, optional):',
    'Not worth the extra tokens for this iteration'
  );
  if(reason === null) return;  // cancelled
  const r = await fetch('/reviews/'+id+'/reject-depth', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ reason: reason }),
  });
  if(!r.ok){
    let msg = 'HTTP '+r.status;
    try { msg = (await r.json()).detail || msg; } catch(e){}
    alert('Could not reject: '+msg);
    return;
  }
  if(openJobId===id) loadDetail(); else loadList();
}

async function loadRepos(){
  try {
    const d = await api('/repos');
    const sel = $('fRepo'), cur = sel.value;
    sel.innerHTML = '<option value="">All repos</option>' +
      d.repos.map(r=>'<option value="'+esc(r.name)+'">'+esc(r.name)+'</option>').join('');
    sel.value = cur;  // preserve current selection across refreshes
  } catch(e){ /* non-fatal */ }
}

async function loadList(){
  const p=$('fProject').value.trim(), f=$('fFeature').value.trim(),
        rp=$('fRepo').value;
  let q='/reviews?limit='+perPage+'&offset='+(page*perPage)+'&archived='+showArchived;
  if(p) q+='&project='+encodeURIComponent(p);
  if(f) q+='&feature='+encodeURIComponent(f);
  if(rp) q+='&repo='+encodeURIComponent(rp);
  const d = await api(q);
  const total = d.total||0;
  const maxPage = Math.max(0, Math.ceil(total/perPage)-1);
  if(page>maxPage){ page=maxPage; return loadList(); }  // clamp after filter change
  const from = total ? d.offset+1 : 0, to = d.offset + d.count;
  $('count').textContent = total ? (from+'–'+to+' of '+total) : '0 jobs';
  $('pgPrev').disabled = page<=0;
  $('pgNext').disabled = page>=maxPage;
  $('pgInfo').textContent = total ? ('Page '+(page+1)+' of '+(maxPage+1)) : '';
  const rows = d.jobs.map(j=>{
    const repos = j.repos.map(shortRepo).join(', ') || '—';
    const pf = (j.project||'—')+' / '+(j.feature||'—');
    let statusCell = '<span class="badge b-'+j.status+'">'+j.status+'</span>';
    if(j.status==='running'||j.status==='queued')
      statusCell += '<div class="muted">'+esc(j.progress||'')+'</div>';
    let verdicts = (j.claude_verdict||j.codex_verdict)
      ? 'C:'+verdictTag(j.claude_verdict)+' X:'+verdictTag(j.codex_verdict) : '—';
    const extra = [];
    if(j.findings_total) extra.push(j.findings_total+' findings');
    if(j.cost_usd!=null) extra.push('$'+j.cost_usd.toFixed(2));
    if(extra.length) verdicts += '<div class="muted">'+extra.join(' · ')+'</div>';
    const archBtn = '<button class="mini" onclick="event.stopPropagation();'+
      'archiveJob(\''+j.job_id+'\','+(showArchived?'false':'true')+')">'+
      (showArchived?'Restore':'Archive')+'</button>';
    const cancelBtn = (j.status==='queued' || j.status==='awaiting_approval')
      ? '<button class="mini" style="margin-right:6px" '+
        'onclick="event.stopPropagation();cancelJob(\''+j.job_id+'\')">Cancel</button>'
      : '';
    return '<tr class="row" onclick="openDetail(\''+j.job_id+'\')">'+
      '<td>'+statusCell+'</td>'+
      '<td>'+esc(pf)+'</td>'+
      '<td class="mono">'+esc(repos)+'</td>'+
      '<td>'+verdicts+'</td>'+
      '<td class="muted">'+fmt(j.created_at)+'</td>'+
      '<td>'+cancelBtn+archBtn+'</td></tr>';
  }).join('');
  $('jobRows').innerHTML = rows;
  $('listEmpty').style.display = d.count? 'none':'block';
}

// --- routing: hash-based so every job has a copy-pasteable URL ---
// #job/<id> opens that job; empty hash shows the list.
function openDetail(id){ location.hash = '#job/'+id; }
function showList(){ if(location.hash) location.hash=''; else applyRoute(); }

async function applyRoute(){
  const h = location.hash.replace(/^#\/?/,'');
  if(h.indexOf('job/')===0){
    openJobId = h.slice(4);
    openJobTerminal = false;   // force a render of the newly-opened job
    $('listView').style.display='none';
    $('detailView').style.display='block';
    await loadDetail();
  } else {
    openJobId = null;
    $('detailView').style.display='none';
    $('listView').style.display='block';
    await loadList();
  }
}
window.addEventListener('hashchange', applyRoute);

async function loadDetail(){
  let j;
  try {
    // ?full=true — the dashboard renders transcript + raw test output
    // inline, so it wants the unabridged payload. AI consumers get the
    // lean default; this is the explicit opt-in for human display.
    j = await api('/reviews/'+openJobId+'?full=true');
  } catch(e) {
    // Server-side serialization can fail for running jobs that have an
    // unserializable Future attached (known bug). Show something useful
    // instead of leaving the page blank.
    $('detailBody').innerHTML =
      '<div class="card"><h3 style="margin:0 0 8px">Could not load this job</h3>'+
      '<p class="muted mono">'+esc(e.message||'')+' on /reviews/'+esc(openJobId)+'</p>'+
      '<p class="muted">If the job is still running, the list view shows its progress. '+
      'Refresh this page after it completes — once a job is persisted to disk the '+
      'response works.</p></div>';
    openJobTerminal = false;  // keep polling — completion will flip it
    return;
  }
  openJobTerminal = (j.status === 'complete' || j.status === 'error');
  const r = j.result || {};
  let h = '';
  const isArch = !!j.archived;
  h += '<div class="card"><div style="display:flex;gap:12px;align-items:center">'+
    '<span class="badge b-'+j.status+'">'+j.status+'</span>'+
    '<strong>'+esc((j.project||'—')+' / '+(j.feature||'—'))+'</strong>'+
    '<span class="mono muted">'+j.job_id+'</span>'+
    (isArch?'<span class="muted">· archived</span>':'')+
    '<span style="flex:1"></span>'+
    ((j.status==='queued' || j.status==='awaiting_approval')
      ? '<button class="mini" style="margin-right:6px" onclick="cancelJob(\''+j.job_id+'\')">Cancel</button>'
      : '')+
    '<button class="mini" onclick="archiveJob(\''+j.job_id+'\','+(isArch?'false':'true')+')">'+
      (isArch?'Restore':'Archive')+'</button></div>';
  if(j.status==='running'||j.status==='queued')
    h += '<div class="progress" style="margin-top:10px"><div class="spin"></div>'+
         esc(j.progress||'working...')+'</div>';
  if(j.status==='error')
    h += '<div class="progress" style="margin-top:10px;background:#fee2e2;'+
         'border-color:#fca5a5;color:#b91c1c">Error: '+esc(j.error||'unknown')+'</div>';
  const req = j.request||{};
  const repoList = (req.repos||(req.repo_url?[{repo_url:req.repo_url,branch:req.branch,base:req.base}]:[]));
  h += '<div style="margin-top:10px" class="muted">created '+fmt(j.created_at)+
       ' · started '+fmt(j.started_at)+' · completed '+fmt(j.completed_at);
  if(j.previous_job_id) h+=' · <a class="back" onclick="openDetail(\''+j.previous_job_id+'\')">prev iteration</a>';
  h += '</div>';
  h += '<div style="margin-top:8px">'+repoList.map(x=>
       '<div class="mono">'+esc(shortRepo(x.repo_url))+' &nbsp; '+
       esc(x.branch||'')+' &larr; '+esc(x.base||'')+'</div>').join('')+'</div>';
  const usage = r.usage;
  if(usage){
    const c = usage.claude||{}, x = usage.codex||{};
    const tk = n => (n||0).toLocaleString();
    // Subscription window — surfaces per-job + rolling-5h aggregate
    // consumption against the Anthropic Opus 5h budget. Disclosure note
    // (title= tooltip) makes it explicit that coder AI sessions and
    // other-project Claude usage on the same account aren't counted.
    const sw = r.subscription_window;
    let swRow = '';
    if(sw){
      swRow =
        '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)" '+
            'title="'+esc(sw.note||'')+'">'+
          '<b>Window:</b> '+sw.pct.toFixed(2)+'% this job &nbsp;·&nbsp; '+
          sw.rolling_5h_pct.toFixed(1)+'% in last 5h '+
          '<span class="muted">('+sw.rolling_5h_job_count+' review'+
            (sw.rolling_5h_job_count===1?'':'s')+', '+
            esc(sw.plan_label)+' $'+(sw.budget_usd).toFixed(0)+
            ' budget — excludes coder AI &amp; other-project usage)</span>'+
        '</div>';
    }
    h += '<div style="margin-top:10px;padding:8px 10px;background:#f8f9fb;'+
         'border:1px solid var(--line);border-radius:6px;font-size:12px">'+
      '<b>Cost: $'+(usage.total_usd||0).toFixed(4)+'</b> &nbsp;·&nbsp; '+
      tk(usage.total_input_tokens)+' in / '+tk(usage.total_output_tokens)+' out tokens'+
      '<div class="muted" style="margin-top:4px">'+
        'Claude — '+tk(c.input_tokens)+' in / '+tk(c.output_tokens)+' out · $'+
        (c.usd||0).toFixed(4)+'<br>'+
        'Codex &nbsp;— '+tk(x.input_tokens)+' in / '+tk(x.output_tokens)+' out '+
        '(no USD — subscription)</div>'+
      swRow+
      '</div>';
  }
  h += '</div>';

  // Awaiting-approval banner (task #10 caller_depth>1 gate). Fires only
  // when the job is currently in awaiting_approval state. Provides the
  // approve/reject affordances right at the top of the detail page so the
  // human doesn't have to hunt for them.
  if(j.status === 'awaiting_approval'){
    const depth = (j.request && j.request.caller_depth) || 2;
    h += '<div class="approval-banner">'+
      '<h3>Approval required: caller_depth='+depth+'</h3>'+
      '<p>The coder AI requested deeper symbol-graph caller-context analysis '+
      '(direct callers + one hop of indirect callers, tagged). This adds '+
      'roughly 10-25K extra input tokens per review and raises the cross-cut '+
      'bug catch rate from ~70% to ~85%. The review will not run until you '+
      'approve.</p>'+
      '<div class="approval-actions">'+
        '<button class="btn-approve" onclick="approveDepth(\''+j.job_id+'\')">'+
          'Approve and run review</button>'+
        '<button class="btn-reject" onclick="rejectDepth(\''+j.job_id+'\')">'+
          'Reject (mark errored)</button>'+
      '</div></div>';
  }

  // submission details — context + handoff (collapsible) + non-default flags.
  // Renders nothing for legacy jobs that have none of these (defensive).
  h += renderSubmissionCard(j, r);

  // Caller-context card (task #10). Shows what the symbol-graph analysis
  // surfaced for the reviewers — depth, counts, the full markdown section
  // that was injected into the reviewer prompt. Collapsed by default.
  const cc = r.caller_context;
  if(cc && (cc.section_md || (cc.per_repo||[]).length)){
    h += '<div class="card"><h3 style="margin:0 0 10px">'+
      'Caller context · what reviewers saw beyond the diff</h3>';
    h += '<div class="muted" style="font-size:12px;margin-bottom:8px">'+
      'depth='+(cc.depth_used||1)+' &nbsp;·&nbsp; '+
      (cc.total_callers_included||0)+' caller(s) included &nbsp;·&nbsp; '+
      (cc.total_bytes||0).toLocaleString()+' chars in payload'+
      '</div>';
    const per = cc.per_repo || [];
    if(per.length){
      h += '<div class="muted mono" style="font-size:12px;margin-bottom:8px">';
      h += per.map(p =>
        esc(shortRepo(p.repo||''))+': '+
        (p.callers_included||0)+' shown · '+
        (p.callers_truncated||0)+' elided · '+
        'syms: '+((p.changed_symbols||[]).join(', ')||'—')
      ).join('<br>');
      h += '</div>';
    }
    if(cc.section_md){
      h += '<details class="caller-disclosure">'+
        '<summary>show full caller-context markdown ('+
        (cc.section_md.length||0).toLocaleString()+' chars)</summary>'+
        '<pre>'+esc(cc.section_md)+'</pre></details>';
    }
    h += '</div>';
  }

  // feature timeline — only when tagged AND more than one iteration exists
  if(j.project && j.feature){
    try {
      const t = await api('/features/'+encodeURIComponent(j.project)+
                          '/'+encodeURIComponent(j.feature));
      h += renderIterations(t.iterations, j.job_id);
    } catch(e){ /* untagged or solo iteration — silent */ }
  }

  // findings — each finding is followed by the OTHER reviewer's stance
  // (agree/disagree/unsure + one-line note) when reconcile produced a
  // peer_assessment array. r.codex_peer_assessment is Codex's stance on
  // Claude's findings; r.claude_peer_assessment is Claude's stance on
  // Codex's findings.
  if(r.claude_findings || r.codex_findings){
    h += '<div class="card"><h3 style="margin:0 0 10px">Findings</h3><div class="fgrid">'+
      '<div><div class="muted" style="margin-bottom:4px">Claude · '+
        (r.claude_findings||[]).length+'</div>'+
        renderFindings(r.claude_findings, r.codex_peer_assessment, 'Codex')+'</div>'+
      '<div><div class="muted" style="margin-bottom:4px">Codex · '+
        (r.codex_findings||[]).length+'</div>'+
        renderFindings(r.codex_findings, r.claude_peer_assessment, 'Claude')+'</div>'+
      '</div></div>';
  }

  // test results
  if(r.test_results){
    h += '<div class="card"><h3 style="margin:0 0 8px">Tier-1 test results</h3>';
    for(const [repo,t] of Object.entries(r.test_results)){
      h += '<div class="testrow"><span class="t-'+t.status+'" style="font-weight:600">'+
           t.status+'</span><span class="mono">'+esc(shortRepo(repo))+'</span>'+
           '<span class="muted">'+(t.duration_s!=null?t.duration_s+'s':'')+
           (t.exit_code!=null?' · exit '+t.exit_code:'')+
           (t.reason?' · '+esc(t.reason):'')+'</span></div>';
    }
    h += '</div>';
  }

  // the four AI communications
  const blocks = [
    ['claude','Claude — Review', r.claude_review],
    ['codex','Codex — Review', r.codex_review],
    ['claude','Claude — Reconciliation', r.claude_reconcile],
    ['codex','Codex — Reconciliation', r.codex_reconcile],
  ];
  for(const [who,title,txt] of blocks){
    if(txt===undefined && j.status!=='complete') continue;
    h += '<div class="review '+who+'"><h3>'+title+'</h3>'+
         '<div class="body md">'+renderMd(txt)+'</div></div>';
  }
  if(r.transcript_md){
    h += '<div class="card"><details><summary>Full transcript</summary>'+
         '<div class="md" style="margin-top:10px">'+renderMd(r.transcript_md)+'</div></details></div>';
  }
  $('detailBody').innerHTML = h;
}

// --- refresh loop ---
let dbTimer=null;
function debouncedRefresh(){ clearTimeout(dbTimer);
  dbTimer=setTimeout(()=>{ page=0; refresh(); },400); }
async function refresh(force){
  try {
    if(openJobId){
      // Skip auto-refresh of a finished job — nothing changes, and a
      // re-render would collapse the transcript / lose scroll position.
      // The manual Refresh button passes force=true to override.
      if(openJobTerminal && !force) return;
      await loadDetail();
    } else {
      await loadList();
    }
    $('autostat').textContent = 'updated '+new Date().toLocaleTimeString();
  } catch(e){ /* auth errors handled in api() */ }
}
function startAuto(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(()=>refresh(false), 6000);  // 6s auto-refresh
}

async function boot(){
  if(!KEY){ gate(true); return; }
  try { await api('/reviews?limit=1'); }
  catch(e){ return; }   // gate already shown
  gate(false);
  await loadRepos();    // populate the repo filter dropdown
  await applyRoute();   // respect #job/<id> if the page was opened on a job URL
  startAuto();
}
boot();
</script>
